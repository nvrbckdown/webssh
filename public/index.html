<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>WebSSH Client</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Toggle Button */
    .toggle-btn {
      position: fixed;
      right: 15px;
      top: 15px;
      width: 44px;
      height: 44px;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all 0.3s;
    }

    .toggle-btn:hover {
      background: #1e2a4a;
      border-color: #4ecca3;
    }

    .toggle-btn.active {
      background: #4ecca3;
    }

    .toggle-btn svg {
      width: 24px;
      height: 24px;
      color: #4ecca3;
      transition: color 0.3s;
    }

    .toggle-btn.active svg {
      color: #1a1a2e;
    }

    /* Connection Panel - Floating Window */
    .connection-panel {
      position: fixed;
      right: 70px;
      top: 15px;
      width: 420px;
      min-width: 380px;
      max-height: calc(100vh - 30px);
      background: #16213e;
      border: 1px solid #333;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .connection-panel.visible {
      display: flex;
    }

    /* Panel Header */
    .panel-header {
      background: #0f0f23;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      user-select: none;
    }

    .panel-header h2 {
      font-size: 0.95rem;
      color: #4ecca3;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-close {
      background: none;
      border: none;
      color: #666;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .panel-close:hover {
      color: #e74c3c;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f23;
      color: #eee;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #4ecca3;
    }

    .form-group textarea {
      font-family: 'Consolas', 'Monaco', monospace;
      resize: none;
      min-height: 60px;
      max-height: 150px;
      overflow-y: auto;
    }

    .form-group textarea.masked {
      -webkit-text-security: disc;
      -moz-text-security: disc;
      text-security: disc;
    }

    .textarea-wrapper {
      position: relative;
    }

    .textarea-wrapper textarea {
      padding-right: 40px;
    }

    .toggle-visibility {
      position: absolute;
      right: 8px;
      top: 8px;
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .toggle-visibility:hover {
      color: #4ecca3;
      background: rgba(78, 204, 163, 0.1);
    }

    .toggle-visibility svg {
      width: 18px;
      height: 18px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .auth-tab {
      padding: 8px 14px;
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 6px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      text-align: center;
      font-size: 0.9rem;
    }

    .auth-tab:hover {
      border-color: #4ecca3;
    }

    .auth-tab.active {
      background: #4ecca3;
      color: #1a1a2e;
      border-color: #4ecca3;
    }

    .auth-section {
      display: none;
    }

    .auth-section.active {
      display: block;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-connect {
      background: #4ecca3;
      color: #1a1a2e;
      flex: 1;
    }

    .btn-connect:hover:not(:disabled) {
      background: #3db892;
    }

    .btn-disconnect {
      background: #e74c3c;
      color: white;
      flex: 1;
    }

    .btn-disconnect:hover:not(:disabled) {
      background: #c0392b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Main Terminal Area */
    .main-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      background: #16213e;
      border-radius: 8px 8px 0 0;
      border-bottom: 1px solid #333;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }

    .status-indicator.connected {
      background: #4ecca3;
      box-shadow: 0 0 8px #4ecca3;
    }

    .status-indicator.connecting {
      background: #f39c12;
      animation: pulse 1s infinite;
    }

    .status-indicator.error {
      background: #e74c3c;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 0.85rem;
      color: #aaa;
      flex: 1;
    }

    .header-title {
      font-size: 1rem;
      color: #4ecca3;
      font-weight: 600;
    }

    #terminal-container {
      background: #0f0f23;
      border-radius: 0 0 8px 8px;
      padding: 10px;
      flex: 1;
      overflow: hidden;
    }

    #terminal {
      height: 100%;
    }

    .error-message {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }

    /* Key file upload */
    .key-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .key-file-upload {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 6px;
      color: #aaa;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-btn:hover {
      border-color: #4ecca3;
      color: #4ecca3;
    }

    .key-file-name {
      font-size: 0.8rem;
      color: #4ecca3;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Panel content layout */
    .panel-body {
      display: flex;
      flex-direction: column;
      padding: 15px 20px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .panel-content {
      width: 100%;
    }

  </style>
</head>
<body>
  <!-- Toggle Button -->
  <button class="toggle-btn" id="toggle-btn" title="Connection Settings (Ctrl+Shift+C)">
    <svg viewBox="0 0 28 24" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="18" width="5" height="6" rx="1" fill="currentColor"/>
      <rect x="8" y="13" width="5" height="11" rx="1" fill="currentColor"/>
      <rect x="15" y="7" width="5" height="17" rx="1" fill="currentColor"/>
      <rect x="22" y="1" width="5" height="23" rx="1" fill="currentColor"/>
    </svg>
  </button>

  <!-- Floating Connection Panel -->
  <div class="connection-panel" id="connection-panel">
    <div class="panel-header" id="panel-header">
      <h2>🔐 SSH Connection</h2>
      <button class="panel-close" id="panel-close">&times;</button>
    </div>
    <div class="panel-body">
      <div class="panel-content">
      <div id="error-container"></div>

      <div class="form-row">
        <div class="form-group">
          <label for="host">Host</label>
          <input type="text" id="host" placeholder="192.168.1.100 or hostname">
        </div>
        <div class="form-group">
          <label for="port">Port</label>
          <input type="number" id="port" value="22" min="1" max="65535">
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="root (default)">
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" data-auth="password">Password</div>
        <div class="auth-tab" data-auth="key">Private Key</div>
      </div>

      <div id="password-auth" class="auth-section active">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password">
        </div>
      </div>

      <div id="key-auth" class="auth-section">
        <div class="form-group">
          <label for="privateKey">Private Key (PEM format)</label>
          <div class="key-input-wrapper">
            <div class="textarea-wrapper">
              <textarea id="privateKey" class="masked" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
              <button type="button" class="toggle-visibility" id="toggleKeyVisibility" title="Show key">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="key-file-upload">
              <label for="keyFile" class="upload-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/>
                  <path d="M12 12l-4 4h3v4h2v-4h3l-4-4z"/>
                </svg>
                Upload Key File
              </label>
              <input type="file" id="keyFile" accept=".pem,.key,.pub,.ppk,*" style="display:none">
              <span id="keyFileName" class="key-file-name"></span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="passphrase">Key Passphrase (optional)</label>
          <input type="password" id="passphrase" placeholder="Enter passphrase if encrypted">
        </div>
      </div>

      <div class="buttons">
        <button class="btn-connect" id="btn-connect">Connect</button>
        <button class="btn-disconnect" id="btn-disconnect" disabled>Disconnect</button>
      </div>
      </div>
    </div>
  </div>

  <!-- Main Terminal -->
  <div class="main-container">
    <div class="status-bar">
      <span class="header-title">WebSSH</span>
      <div style="flex:1"></div>
      <div class="status-indicator" id="status-indicator"></div>
      <span class="status-text" id="status-text">Disconnected</span>
    </div>
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <script>
    // ========== Panel Toggle ==========
    const panel = document.getElementById('connection-panel');
    const toggleBtn = document.getElementById('toggle-btn');
    const closeBtn = document.getElementById('panel-close');

    // Toggle panel visibility
    function togglePanel() {
      panel.classList.toggle('visible');
      toggleBtn.classList.toggle('active');
      if (panel.classList.contains('visible')) {
        document.getElementById('host').focus();
      } else {
        terminal.focus();
      }
    }

    toggleBtn.addEventListener('click', togglePanel);
    closeBtn.addEventListener('click', togglePanel);

    // ========== Terminal Setup ==========
    const terminal = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: '"Cascadia Code", "Fira Code", Consolas, Monaco, monospace',
      theme: {
        background: '#0f0f23',
        foreground: '#eee',
        cursor: '#4ecca3',
        selection: 'rgba(78, 204, 163, 0.3)',
        black: '#1a1a2e',
        red: '#e74c3c',
        green: '#4ecca3',
        yellow: '#f39c12',
        blue: '#3498db',
        magenta: '#9b59b6',
        cyan: '#1abc9c',
        white: '#ecf0f1',
      },
      scrollback: 10000,
    });

    const fitAddon = new FitAddon.FitAddon();
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();
    
    terminal.loadAddon(fitAddon);
    terminal.loadAddon(webLinksAddon);
    terminal.open(document.getElementById('terminal'));
    
    // Fit terminal after a small delay to ensure container is sized
    setTimeout(() => fitAddon.fit(), 100);

    // ========== Elements ==========
    const btnConnect = document.getElementById('btn-connect');
    const btnDisconnect = document.getElementById('btn-disconnect');
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const errorContainer = document.getElementById('error-container');
    const authTabs = document.querySelectorAll('.auth-tab');

    let ws = null;

    // Auth tab switching
    authTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        authTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        document.querySelectorAll('.auth-section').forEach(s => s.classList.remove('active'));
        document.getElementById(`${tab.dataset.auth}-auth`).classList.add('active');
      });
    });

    // Key file upload handler
    const keyFileInput = document.getElementById('keyFile');
    const keyFileName = document.getElementById('keyFileName');
    const privateKeyTextarea = document.getElementById('privateKey');
    const toggleKeyVisibility = document.getElementById('toggleKeyVisibility');
    const eyeIcon = document.getElementById('eyeIcon');

    // Toggle private key visibility
    let keyVisible = false;
    toggleKeyVisibility.addEventListener('click', () => {
      keyVisible = !keyVisible;
      if (keyVisible) {
        privateKeyTextarea.classList.remove('masked');
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
        toggleKeyVisibility.title = 'Hide key';
      } else {
        privateKeyTextarea.classList.add('masked');
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
        toggleKeyVisibility.title = 'Show key';
      }
    });

    // Auto-resize textarea function
    function autoResizeTextarea(textarea) {
      textarea.style.height = 'auto';
      const newHeight = Math.min(textarea.scrollHeight, 150);
      textarea.style.height = newHeight + 'px';
    }

    // Listen for input/paste on private key textarea
    privateKeyTextarea.addEventListener('input', () => {
      autoResizeTextarea(privateKeyTextarea);
    });

    privateKeyTextarea.addEventListener('paste', () => {
      setTimeout(() => autoResizeTextarea(privateKeyTextarea), 0);
    });

    keyFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        keyFileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (event) => {
          privateKeyTextarea.value = event.target.result;
          autoResizeTextarea(privateKeyTextarea);
        };
        reader.onerror = () => {
          showError('Failed to read key file');
          keyFileName.textContent = '';
        };
        reader.readAsText(file);
      }
    });

    // Window resize handler
    window.addEventListener('resize', () => {
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'resize',
          cols: terminal.cols,
          rows: terminal.rows
        }));
      }
    });

    // Show error
    function showError(message) {
      errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
      setTimeout(() => errorContainer.innerHTML = '', 5000);
    }

    // Update status
    function setStatus(status, text) {
      statusIndicator.className = 'status-indicator ' + status;
      statusText.textContent = text;
    }

    // Connect
    btnConnect.addEventListener('click', () => {
      const host = document.getElementById('host').value.trim();
      const port = parseInt(document.getElementById('port').value) || 22;
      const username = document.getElementById('username').value.trim() || 'root';
      const password = document.getElementById('password').value;
      const privateKey = document.getElementById('privateKey').value.trim();
      const passphrase = document.getElementById('passphrase').value;

      if (!host) {
        showError('Host is required');
        return;
      }

      if (!password && !privateKey) {
        showError('Password or private key is required');
        return;
      }

      terminal.clear();
      terminal.write('\x1b[33mConnecting to ' + host + '...\x1b[0m\r\n');
      setStatus('connecting', 'Connecting...');
      btnConnect.disabled = true;

      // Determine WebSocket protocol
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

      ws.onopen = () => {
        const connectMsg = {
          type: 'connect',
          host,
          port,
          username,
          cols: terminal.cols,
          rows: terminal.rows
        };

        if (privateKey) {
          connectMsg.privateKey = privateKey;
          if (passphrase) connectMsg.passphrase = passphrase;
        } else {
          connectMsg.password = password;
        }

        ws.send(JSON.stringify(connectMsg));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          switch (msg.type) {
            case 'data':
              terminal.write(msg.data);
              break;
            case 'status':
              if (msg.data === 'connected') {
                setStatus('connected', `Connected: ${username}@${host}`);
                btnDisconnect.disabled = false;
                // Auto-hide panel on successful connection
                if (panel.classList.contains('visible')) {
                  togglePanel();
                }
              } else if (msg.data === 'disconnected') {
                setStatus('', 'Disconnected');
                btnConnect.disabled = false;
                btnDisconnect.disabled = true;
              }
              break;
            case 'error':
              terminal.write(`\x1b[31m${msg.data}\x1b[0m\r\n`);
              setStatus('error', 'Error');
              showError(msg.data);
              btnConnect.disabled = false;
              break;
          }
        } catch (e) {
          console.error('Message parse error:', e);
        }
      };

      ws.onclose = () => {
        setStatus('', 'Disconnected');
        btnConnect.disabled = false;
        btnDisconnect.disabled = true;
        terminal.write('\r\n\x1b[33mConnection closed\x1b[0m\r\n');
      };

      ws.onerror = (err) => {
        setStatus('error', 'Connection error');
        showError('WebSocket connection failed');
        btnConnect.disabled = false;
      };
    });

    // Disconnect
    btnDisconnect.addEventListener('click', () => {
      if (ws) {
        ws.send(JSON.stringify({ type: 'disconnect' }));
        ws.close();
      }
    });

    // Terminal input
    terminal.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'data', data }));
      }
    });

    // Initial message
    terminal.write('WebSSH Client Ready\r\n');
    terminal.write('Click the signal icon in the top-right corner to connect\r\n');
    terminal.write('Or press Ctrl+Shift+C\r\n\r\n');

    // Keyboard shortcut to toggle panel (Ctrl+Shift+C)
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        togglePanel();
      }
      // Escape to close panel
      if (e.key === 'Escape' && panel.classList.contains('visible')) {
        togglePanel();
      }
    });

    // Connect on Enter in form fields
    ['host', 'username', 'password', 'passphrase'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !btnConnect.disabled) {
          btnConnect.click();
        }
      });
    });
  </script>
</body>
</html>
